name: Local scaffold checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartmanu
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: smartmanu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartmanu -d smartmanu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://smartmanu:local-test-only@127.0.0.1:5432/smartmanu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run check
