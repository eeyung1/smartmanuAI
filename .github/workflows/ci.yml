name: Local scaffold checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run check
